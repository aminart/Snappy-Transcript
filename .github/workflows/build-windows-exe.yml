name: Build Windows exe

# Fabrique SnappyTranscript.exe sur une machine Windows de GitHub, comme build_exe.bat gpu :
# transcription (faster-whisper, CPU + GPU NVIDIA CUDA) + identification des intervenants (pyannote, PyTorch CPU).
# - à la main (onglet Actions), ou sur une PR qui touche à la fabrication : l'exe est disponible en
#   artefact « SnappyTranscript-windows » ;
# - à chaque release publiée (tag vX.Y.Z) : l'exe est en plus joint à la release, sous le nom
#   SnappyTranscript-X.Y.Z.exe, avec un zip. Le tag doit correspondre au fichier VERSION.
# Le modèle de transcription et celui des intervenants ne sont pas dans l'exe : Studio Dock les fournit.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - app.spec
      - VERSION
      - backend/launcher.py
      - backend/requirements*.txt
      - backend/vendor/**
      - icone/**
      - .github/workflows/build-windows-exe.yml
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Snappy Transcript $version"
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            if [ "$tag" != "v$version" ]; then
              echo "::error::Le tag $tag ne correspond pas au fichier VERSION ($version). Lancer scripts/bump_version.py avant la release."
              exit 1
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Interface
        run: |
          cp icone/app.svg frontend/public/icone.svg
          cd frontend
          npm ci
          npm run build

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install --no-index --find-links backend/vendor comtypes psutil
          # Runtimes CUDA (cuBLAS, cuDNN) pour la transcription GPU NVIDIA avec faster-whisper
          pip install -r backend/requirements-gpu.txt
          # PyTorch CPU pour l'identification des intervenants (pyannote)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements-diarization.txt pyinstaller

      - name: Exécutable
        run: pyinstaller --noconfirm app.spec

      - name: Vérification
        run: |
          exe=./dist/SnappyTranscript.exe
          ls -l "$exe"
          "$exe" --version
          "$exe" --check | tee check.txt || true
          if grep -q "ÉCHEC" check.txt; then echo "::error::Une brique ne se charge pas dans l'exe"; exit 1; fi
          if ! grep -q "OK      Intervenants" check.txt; then echo "::error::L'identification des intervenants manque dans l'exe"; exit 1; fi
          "$exe" --no-browser --port 8599 &
          for i in $(seq 120); do curl -sf http://127.0.0.1:8599/health && exit 0; sleep 1; done
          echo "::error::L'exe ne répond pas sur /health"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: SnappyTranscript-windows
          path: dist/SnappyTranscript.exe
          if-no-files-found: error

      - name: Joindre l'exe et le zip à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          name="SnappyTranscript-$version.exe"
          cp dist/SnappyTranscript.exe "dist/$name"
          # Zip à côté de l'exe : passe les filtres qui bloquent le téléchargement d'un .exe.
          base="SnappyTranscript-$version-windows"
          mkdir -p "dist/zip/$base"
          cp dist/SnappyTranscript.exe "dist/zip/$base/"
          cp CHANGELOG.md "dist/zip/$base/"
          (cd dist/zip && python -m zipfile -c "../$base.zip" "$base")
          gh release upload "${{ github.event.release.tag_name }}" "dist/$name" "dist/$base.zip" --clobber
